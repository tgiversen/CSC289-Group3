<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SpinStorm -- Game Selector</title>
        <style>
            .title {
                justify-content: center;
                align-items: center;
                display: flex;
                font-size: 100px;
                font-weight: bold;
                color: black;
                border: 4px yellow solid;
                background-color: yellow;
                border-radius: 50%;
                width: 500px;
                width: 500px;
            }

            body {
                justify-content: center;
                align-items: center;
                display: flex;
                height: 100vh;
                margin: 0px;
                background-color: darkblue;
                font-family: Arial, Helvetica, sans-serif;
            }

           .container h1 {
               margin-bottom: 20px;
               text-align: center;
            }

            button {
                width: 100px;
                height: 300px;
                padding: 20px;
                font-weight: bold;
                border-radius: 8px;
            }

            .games {
                display: flex;
                justify-content: space-between;
                gap: 20px;
            }

            .game-option {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .game1 {
                font-size: medium;
                font-weight: bold;
                font-family: Arial, Helvetica, sans-serif;
                background-color: red;
                color: black;
                width: 200px;
                height: 150px;
            }

            .game2 {
                font-size: medium;
                font-weight: bold;
                font-family: Arial, Helvetica, sans-serif;
                background-color: yellow;
                color: black;
                width: 200px;
                height: 150px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1 class="title">SpinStorm</h1>
            <div class="games">
                <div class="game-option">
                    <button class="game1" id="game1" type="button">Shape Frenzy</button>
                </div>
                <h1>Choose your Game</h1>
                <div class="game-option">
                    <button class="game2" id="game2" type="button">Diamond in the Rough</button>
                </div>
            </div>
        </div>
    </body>
</html>
